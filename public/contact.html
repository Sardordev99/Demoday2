<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — TutorHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Tutor<span>Hub</span></a>
    <nav class="main-nav">
      <a href="index.html">Главная</a>
      <a href="tutors.html">Репетиторы</a>
      <a href="about.html">О нас</a>
      <a href="pricing.html">Тарифы</a>
      <a href="contact.html">Контакты</a>
      <a href="admin.html">Админ</a>
    </nav>
  </header>

  <main class="page-content">
    <section class="page-hero">
      <span class="eyebrow">Мы на связи</span>
      <h1>Есть вопрос?</h1>
      <p>Напиши нам — мы будем рады узнать твоё мнение о TutorHub.</p>
    </section>

    <section class="page-panel contact-panel">
      <form id="contactForm">
        <label for="contactName">Твоё имя</label>
        <input id="contactName" name="name" required
          placeholder="Как к тебе обращаться?">

        <label for="contactEmail">Электронная почта</label>
        <input id="contactEmail" name="email" type="email" required
          placeholder="you@example.com">

        <label for="contactMessage">Сообщение</label>
        <textarea id="contactMessage" name="message" rows="5" required
          placeholder="Напиши своё сообщение..."></textarea>

        <button class="primary-link" type="submit">Отправить сообщение</button>
        <p id="contactStatus" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 TutorHub</p>
  </footer>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("contactStatus").textContent =
        "Форма пока демонстрационная: сообщение не отправлено на сервер.";
    });
  </script>
</body>
</html>
