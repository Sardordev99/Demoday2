
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Репетиторы — TutorHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Tutor<span>Hub</span></a>
    <nav class="main-nav">
      <a href="index.html">Главная</a>
      <a href="tutors.html">Репетиторы</a>
      <a href="about.html">О нас</a>
      <a href="pricing.html">Тарифы</a>
      <a href="contact.html">Контакты</a>
      <a href="admin.html">Админ</a>
    </nav>
  </header>

  <main class="page-content">
    <section class="page-hero">
      <span class="eyebrow">Найди своего преподавателя</span>
      <h1>Лучшие репетиторы для твоих целей</h1>
      <p>Выбирай предмет, удобную цену и формат обучения.</p>
    </section>

    <input id="searchInput" type="search" placeholder="Имя или предмет">

<select id="subjectFilter">
    <option value="">Все предметы</option>
    <option value="Математика">Математика</option>
    <option value="Английский язык">Английский</option>
    <option value="Физика">Физика</option>
    <option value="Химия">Химия</option>
    <option value="Биология">Биология</option>
    <option value="Программирование">Программирование</option>
    <option value="История">История</option>
    <option value="Русский язык">Русский язык</option>
    <option value="IELTS">IELTS</option>
    <option value="Узбекский язык">Узбекский язык</option>
</select>

<select id="formatFilter">
    <option value="">Любой формат</option>
    <option value="online">Онлайн</option>
    <option value="offline">Офлайн</option>
</select>

<input id="maxPrice" type="number" min="0" placeholder="Цена до (сум)">

<button id="resetFilters" type="button">Сбросить фильтры</button>

<p id="resultCount"></p>

<div id="tutorGrid" class="tutor-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 TutorHub. Учись с удовольствием.</p>
  </footer>
</body>
</html>
